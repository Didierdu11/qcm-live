<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>QCM Live</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script></head><body><header class="topbar"><a class="brand" href="#home">QCM Live</a><span id="connectionState" class="connection">Connexion…</span></header><main id="app" class="container"></main><div id="toast" class="toast hidden"></div><template id="homeTemplate"><section class="hero"><span class="eyebrow">QCM autonome</span><h1>Préparez, lancez et analysez vos QCM.</h1><p>Les participants avancent à leur rythme et voient uniquement leur résultat global à la fin.</p><div class="actions"><a class="button primary" href="#library">Mes QCM</a><button id="showJoin" class="button secondary">Rejoindre une salle</button></div></section><section id="joinPanel" class="card hidden"><h2>Rejoindre une salle</h2><label>Code de la salle<input id="joinCode" maxlength="6" placeholder="AB7K2P"></label><button id="joinCodeButton" class="button primary wide">Continuer</button></section></template><template id="libraryTemplate"><section class="heading"><span class="eyebrow">Présentateur</span><h1>Mes QCM</h1><p>Préparez plusieurs QCM et lancez celui de votre choix.</p><div class="actions left"><a class="button primary" href="#editor=new">+ Nouveau QCM</a><button id="importButton" class="button secondary">Importer JSON</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></section><section class="card"><div id="quizList"></div></section></template><template id="editorTemplate"><section class="heading"><span class="eyebrow">Éditeur</span><h1 id="editorHeading">Nouveau QCM</h1></section><section class="card"><label>Titre du QCM<input id="quizTitle" maxlength="100"></label><label>Description<input id="quizDescription" maxlength="240"></label><label>Durée par question en secondes, 0 = sans limite<input id="defaultDuration" type="number" min="0" max="3600" value="0"></label></section><div id="questionsEditor"></div><button id="addQuestion" class="button secondary wide">+ Ajouter une question</button><button id="saveQuiz" class="button primary wide">Enregistrer le QCM</button></template><template id="hostTemplate"><section class="host-grid"><div><span class="eyebrow">Session présentateur</span><h1 id="hostTitle"></h1><p>Code : <strong class="room-code" id="hostCode"></strong></p><div id="qrBox" class="qr"></div><button id="copyJoinLink" class="button secondary">Copier le lien</button></div><section class="card"><h2>Progression</h2><div id="completedCount" class="number">0</div><p id="completedLabel"></p><button id="closeRoom" class="button secondary wide">Fermer la session</button><button id="downloadPdf" class="button primary wide">Rapport PDF formateur</button><button id="downloadBlankPdf" class="button secondary wide">PDF vierge hors ligne</button></section></section><section class="card"><h2>Suivi détaillé</h2><p>1 = complet · 0,5 = partiel · 0 = erreur · — = non répondu.</p><div class="filters"><button class="button secondary" id="filterAll">Tous</button><button class="button secondary" id="filterOpen">En cours</button><button class="button secondary" id="filterDone">Terminés</button></div><div class="table-wrap"><table id="progressTable"></table></div></section></template><template id="joinTemplate"><section><span class="eyebrow">Participant</span><h1 id="joinTitle"></h1><section id="nameCard" class="card"><label>Nom et prénom<input id="playerName" maxlength="60" placeholder="Ex. Jean Dupont" autocomplete="name"></label><button id="enterRoom" class="button primary wide">Rejoindre le QCM</button></section><section id="questionCard" class="card hidden"></section><section id="resultCard" class="card hidden"></section></section></template><script type="module" src="app.js"></script></body></html>
